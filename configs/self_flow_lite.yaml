experiment:
  name: monet_self_flow_lite
  output_dir: outputs/monet_self_flow_lite
  seed: 17

data:
  train_dir: data/processed/monet_train
  val_dir: data/processed/monet_val
  latent_channels: 32
  latent_size: 16
  text_dim: 512
  num_workers: 4

model:
  hidden_size: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  aux_layer: 4

training:
  max_steps: 100000
  batch_size: 64
  grad_accum_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.05
  precision: bf16
  log_every: 25
  save_every: 2500
  val_every: 1000
  max_grad_norm: 1.0

self_flow_lite:
  enabled: true
  per_token_timesteps: true
  mask_ratio: 0.25
  masked_token_t: 1.0
  aux_loss_weight: 0.1
  aux_masked_only: true
