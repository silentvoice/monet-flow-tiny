experiment:
  name: smoke
  output_dir: outputs/smoke
  seed: 7

data:
  train_dir: data/processed/toy
  val_dir: data/processed/toy
  latent_channels: 32
  latent_size: 16
  text_dim: 512
  num_workers: 0

model:
  hidden_size: 128
  depth: 2
  num_heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  aux_layer: 1

training:
  max_steps: 10
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 0.0003
  weight_decay: 0.01
  precision: fp32
  log_every: 1
  save_every: 10
  val_every: 10
  max_grad_norm: 1.0

self_flow_lite:
  enabled: false
  per_token_timesteps: false
  mask_ratio: 0.0
  masked_token_t: 1.0
  aux_loss_weight: 0.0
  aux_masked_only: true
